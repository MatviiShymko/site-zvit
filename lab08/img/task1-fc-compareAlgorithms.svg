 fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="69.5" text-anchor="middle" fill="#111">Початок</text><rect x="164.1" y="130.0" width="255.2" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="157.5" text-anchor="middle" fill="#111">c = ціла частина 20000000 / (n · m) + 1</text><rect x="116.6" y="220.0" width="350.1" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="247.5" text-anchor="middle" fill="#111">Пам'ять CRS = (2 · NNZ + n + 1) · розмір цілого числа</text><rect x="71.3" y="310.0" width="440.7" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="337.5" text-anchor="middle" fill="#111">Пам'ять матриці = n · розмір покажчика + n · m · розмір цілого числа</text><rect x="205.2" y="400.0" width="172.8" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="427.5" text-anchor="middle" fill="#111">Запам'ятати час початку</text><rect x="226.6" y="490.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="517.5" text-anchor="middle" fill="#111">i = 0</text><polygon points="291.6,580.0 366.6,618.0 291.6,656.0 216.6,618.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="622.5" text-anchor="middle" fill="#111">i &lt; c</text><rect x="92.7" y="700.0" width="397.8" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><line x1="101.7" y1="700.0" x2="101.7" y2="746.0" stroke="#222" stroke-width="1.5"/><line x1="481.5" y1="700.0" x2="481.5" y2="746.0" stroke="#222" stroke-width="1.5"/><text x="291.6" y="727.5" text-anchor="middle" fill="#111">Обчислити добутки за масивами CRS, звільнити їх пам'ять</text><rect x="226.6" y="790.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="817.5" text-anchor="middle" fill="#111">Збільшити i на 1</text><rect x="125.4" y="924.0" width="332.5" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="951.5" text-anchor="middle" fill="#111">Час 1 = поточний час - час початку, у мілісекундах</text><rect x="205.2" y="1014.0" width="172.8" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="1041.5" text-anchor="middle" fill="#111">Запам'ятати час початку</text><rect x="226.6" y="1104.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="1131.5" text-anchor="middle" fill="#111">i = 0</text><polygon points="291.6,1194.0 366.6,1232.0 291.6,1270.0 216.6,1232.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="1236.5" text-anchor="middle" fill="#111">i &lt; c</text><rect x="82.0" y="1314.0" width="419.3" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><line x1="91.0" y1="1314.0" x2="91.0" y2="1360.0" stroke="#222" stroke-width="1.5"/><line x1="492.3" y1="1314.0" x2="492.3" y2="1360.0" stroke="#222" stroke-width="1.5"/><text x="291.6" y="1341.5" text-anchor="middle" fill="#111">Обчислити добутки за повною матрицею, звільнити їх пам'ять</text><rect x="226.6" y="1404.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="1431.5" text-anchor="middle" fill="#111">Збільшити i на 1</text><rect x="125.4" y="1538.0" width="332.5" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="1565.5" text-anchor="middle" fill="#111">Час 2 = поточний час - час початку, у мілісекундах</text><polygon points="198.3,1628.0 403.3,1628.0 384.9,1674.0 179.9,1674.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="1655.5" text-anchor="middle" fill="#111">Вивести кількість повторів c</text><polygon points="169.8,1718.0 431.8,1718.0 413.4,1764.0 151.4,1764.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="1745.5" text-anchor="middle" fill="#111">Вивести час і пам'ять обох алгоритмів</text><polygon points="128.8,1808.0 472.9,1808.0 454.5,1854.0 110.4,1854.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="1835.5" text-anchor="middle" fill="#111">Вивести час одного обчислення кожного алгоритму</text><polygon points="291.6,1898.0 366.6,1936.0 291.6,1974.0 216.6,1936.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="1940.5" text-anchor="middle" fill="#111">Час 1 &gt; 0</text><polygon points="173.0,2022.0 428.7,2022.0 410.3,2068.0 154.6,2068.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="2049.5" text-anchor="middle" fill="#111">Вивести відношення часу 2 до часу 1</text><polygon points="128.2,2156.0 473.5,2156.0 455.1,2202.0 109.8,2202.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="2183.5" text-anchor="middle" fill="#111">Вивести відношення пам'яті матриці до пам'яті CRS</text><rect x="226.6" y="2246.0" width="130.0" height="42.0" rx="21.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="291.6" y="2271.5" text-anchor="middle" fill="#111">Кінець</text></svg>