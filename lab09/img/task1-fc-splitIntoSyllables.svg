-anchor="middle" fill="#111">Початок</text><polygon points="189.9,130.0 392.2,130.0 373.8,176.0 171.5,176.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="157.5" text-anchor="middle" fill="#111">Ввести слово w, результат P</text><rect x="205.2" y="220.0" width="153.3" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="247.5" text-anchor="middle" fill="#111">Кількість складів = 0</text><rect x="216.9" y="310.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="337.5" text-anchor="middle" fill="#111">i = 0</text><rect x="209.1" y="400.0" width="145.6" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="427.5" text-anchor="middle" fill="#111">P = порожній рядок</text><polygon points="281.9,490.0 368.9,528.0 281.9,566.0 194.8,528.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="532.5" text-anchor="middle" fill="#111">wᵢ не кінець слова</text><rect x="213.6" y="610.0" width="136.6" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="637.5" text-anchor="middle" fill="#111">Дописати wᵢ до P</text><polygon points="281.9,700.0 405.9,762.0 281.9,824.0 157.9,762.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" text-anchor="middle" fill="#111"><tspan x="281.9" y="756.5">wᵢ голосна, а</tspan><tspan x="281.9" y="776.5">наступна літера ні?</tspan></text><rect x="170.2" y="872.0" width="223.3" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="899.5" text-anchor="middle" fill="#111">Збільшити кількість складів на 1</text><rect x="122.9" y="962.0" width="317.9" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="989.5" text-anchor="middle" fill="#111">c = кількість приголосних до наступної голосної</text><polygon points="281.9,1052.0 358.1,1090.0 281.9,1128.0 205.6,1090.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="1094.5" text-anchor="middle" fill="#111">Далі є голосна?</text><rect x="82.0" y="1176.0" width="399.7" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="1203.5" text-anchor="middle" fill="#111">Дописати до P половину цих приголосних (c / 2, ціла частина)</text><rect x="206.6" y="1266.0" width="150.5" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="1293.5" text-anchor="middle" fill="#111">Дописати до P дефіс</text><rect x="216.9" y="1356.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="1383.5" text-anchor="middle" fill="#111">i = i + c / 2</text><rect x="216.9" y="1534.0" width="130.0" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="1561.5" text-anchor="middle" fill="#111">Збільшити i на 1</text><polygon points="281.9,1668.0 377.6,1706.3 281.9,1744.6 186.1,1706.3" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="1710.8" text-anchor="middle" fill="#111">Кількість складів = 0?</text><rect x="205.2" y="1792.6" width="153.3" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="1820.1" text-anchor="middle" fill="#111">Кількість складів = 1</text><rect x="183.2" y="1926.6" width="197.4" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="1954.1" text-anchor="middle" fill="#111">Повернути кількість складів</text><rect x="216.9" y="2016.6" width="130.0" height="42.0" rx="21.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="281.9" y="2042.1" text-anchor="middle" fill="#111">Кінець</text></svg>